[pytest]
pythonpath = . ..
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Fast deterministic unit tests (no network, $0 cost, Gate 0)
    integration: Multi-component integration tests
    llm_eval: Live LLM / ADK AgentEvaluator tests (Days 5-8, Gate 2)
addopts = -v --strict-markers